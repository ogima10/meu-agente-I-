
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Agendamentos.</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="whatsapp-container">
        <!-- Topo do Chat -->
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar-container">
                    <img src="https://unsplash.com" alt="Foto de Perfil">
                </div>
                <div class="status-container">
                    <h3>Atendente Virtual</h3>
                    <span class="status">online</span>
                </div>
            </div>
            <div class="header-icons">
                <span class="material-icons">videocam</span>
                <span class="material-icons">call</span>
                <span class="material-icons">more_vert</span>
            </div>
        </div>
        
        <!-- Mensagens -->
        <div class="chat-messages" id="chatMessages">
            <div class="crypto-notice">
                🔒 As mensagens são protegidas e criptografadas. Este é um assistente virtual comercial.
            </div>
        </div>
        
        <!-- Barra de Baixo -->
        <div class="chat-input-area">
            <span class="material-icons icon-btn">sentiment_satisfied_alt</span>
            <span class="material-icons icon-btn">attach_file</span>
            <input type="text" id="userInput" placeholder="Digite uma mensagem" autocomplete="off">
            <button id="sendBtn">
                <span class="material-icons">send</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
